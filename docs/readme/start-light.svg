<svg xmlns="http://www.w3.org/2000/svg" width="720" height="312" viewBox="0 0 720 312" role="img" aria-label="Getting started: install Python, download the blank zip, double-click Open_Web.bat" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>Getting started: install Python, download the blank zip, double-click Open_Web.bat</title>
<rect x="1" y="1" width="718" height="310" rx="18" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<path d="M52 82.0V134.0" stroke="#d0d7de" stroke-width="2.4" stroke-dasharray="2 6" stroke-linecap="round"/>
<circle cx="52" cy="60.0" r="20" fill="#7f6fe0"/>
<text x="52" y="67.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="92" y="54.0" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start">Install Python 3.9+</text>
<text x="92" y="80.0" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">python.org, the big yellow button. On Windows tick “Add to PATH”.</text>
<path d="M52 178.0V230.0" stroke="#d0d7de" stroke-width="2.4" stroke-dasharray="2 6" stroke-linecap="round"/>
<circle cx="52" cy="156.0" r="20" fill="#55c2b8"/>
<text x="52" y="163.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="92" y="150.0" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start">Download the blank zip</text>
<text x="92" y="176.0" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">From Releases. Unzip it where you want to keep your data.</text>
<circle cx="52" cy="252.0" r="20" fill="#7f6fe0"/>
<text x="52" y="259.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="92" y="246.0" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start">Double-click Open_Web.bat</text>
<text x="92" y="272.0" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">Or run python3 tools/twin_web.py. Set a password, add an AI key.</text>
</svg>
